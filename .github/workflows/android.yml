name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android command line tools
        run: |
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          curl -fL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/android-tools.zip
          unzip -q /tmp/android-tools.zip -d /tmp/android-tools
          mv /tmp/android-tools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" --licenses >/dev/null || true
          "$HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$HOME/android-sdk" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build test APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Turnik-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Check signing secrets
        id: signing
        env:
          KEY_B64: ${{ secrets.TURNIK_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.TURNIK_KEY_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ] && [ -n "$KEY_PASSWORD" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "ready=false" >> "$GITHUB_OUTPUT"; fi
      - name: Prepare release key
        if: steps.signing.outputs.ready == 'true'
        env:
          KEY_B64: ${{ secrets.TURNIK_KEYSTORE_B64 }}
          KEY_PASSWORD: ${{ secrets.TURNIK_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEY_B64" | base64 --decode > "$RUNNER_TEMP/turnik-release.jks"
          echo "TURNIK_KEYSTORE_FILE=$RUNNER_TEMP/turnik-release.jks" >> "$GITHUB_ENV"
          echo "TURNIK_KEYSTORE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "TURNIK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "TURNIK_KEY_ALIAS=turnik" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: steps.signing.outputs.ready == 'true'
        run: gradle --no-daemon :app:assembleRelease
      - name: Publish release
        if: steps.signing.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle | head -1)
          test -n "$VERSION"
          cp app/build/outputs/apk/release/app-release.apk turnik.apk
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" turnik.apk --clobber
          else
            gh release create "v$VERSION" turnik.apk --title "Турник v$VERSION" --notes "Автоматическое обновление приложения"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.signing.outputs.ready == 'true'
        with:
          name: Turnik-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
